name: Verify public plugin
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Import reviewed public source archive
        id: initial
        shell: bash
        run: |
          if [ -f release-source.tgz ]; then
            echo "cd0589a73ea03133dea52739363ddc86788db10164b1a701aac1c441f35fa049  release-source.tgz" | sha256sum --check
            tar -xzf release-source.tgz
            rm release-source.tgz
            echo "imported=true" >> "$GITHUB_OUTPUT"
          fi
      - run: npm ci --no-audit --no-fund
      - run: npm run build:data
      - run: npm test
      - name: Commit verified public source and publish v0.3.2
        if: steps.initial.outputs.imported == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Publish v0.3.2 with updated branding, README and screenshots"
          git push origin HEAD:main
          npm pack --ignore-scripts
          gh release create v0.3.2 dsh-video-prompt-0.3.2.tgz --target "$(git rev-parse HEAD)" --title "生视频提示词库v0.3.2" --notes-file CHANGELOG.md
